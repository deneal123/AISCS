services:
  research:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PORT: "8080"
      RESEARCH_DATA_DIR: /data
    ports:
      - "${RESEARCH_PORT:-8091}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5))['ok']"
      interval: 15s
      timeout: 7s
      retries: 4
      start_period: 10s
    restart: unless-stopped
