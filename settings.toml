# Объявленные несекретные дефолты сайдкара opendataloader.
#
# Приоритет: env > этот файл > дефолт в коде. Имена выводятся механически:
# `[odl] max_bytes` → `ODL_MAX_BYTES`.
#
# ⚠️ Секретам здесь не место: файл коммитится.

[odl]
# Потолок вложения.
max_bytes = 20971520
# Дедлайн конвертации через LibreOffice.
lo_timeout_sec = 120
# Дедлайн разбора PDF.
parse_timeout_sec = 300
# ⚠️ Два ниже раньше не были объявлены нигде: читались кодом, но не задавались ни
# в compose, ни в .env.example.
soffice = "soffice"
max_sheet_rows = 2000
