# Объявленные несекретные дефолты сайдкара duckdb.
#
# Приоритет: env > этот файл > дефолт в коде. Переменная окружения с тем же именем
# всегда сильнее — файл лишь заполняет пустоты (см. settings.py).
#
# Имена переменных выводятся механически: СЕКЦИЯ_КЛЮЧ в верхнем регистре. То есть
# `[duckdb] max_rows` → `DUCKDB_MAX_ROWS`, ровно как в compose. Ничего не
# переименовано: это условие безопасности переезда.
#
# ⚠️ Секретам здесь не место — файл коммитится.

[duckdb]
# Строк в ответе по умолчанию: больше — раздувает контекст LLM.
max_rows = 200
# Жёсткий потолок: `max_rows` приходит из запроса, и без клампа модель вытянула бы всё.
hard_max_rows = 2000
# Память DuckDB на запрос — защита от OOM на гигантском файле или джойне.
memory_limit = "512MB"
# Потолок тела запроса: файлы приходят base64 (≈+33% к размеру).
max_body_bytes = 67108864
# ⚠️ Раньше НЕ БЫЛО ОБЪЯВЛЕНО НИГДЕ: читалось кодом, но не задавалось ни в compose,
# ни в .env.example. Поменять его можно было только пересборкой образа.
max_xlsx_rows = 100000
