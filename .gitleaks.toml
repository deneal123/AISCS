# Настройка сканера секретов. Правила берём стандартные и НИ ОДНО не отключаем —
# здесь только точечные исключения, каждое с причиной.
#
# ⚠️ Зачем файл вообще появился. Джоба «Gitleaks» падала на каждом пуше с «missing
# gitleaks license»: обёртка `gitleaks-action` на репозитории организации требует
# платную лицензию и без неё НЕ СКАНИРУЕТ НИЧЕГО. То есть проверка выглядела
# настроенной, была красной и при этом пропустила бы настоящий секрет. В CI обёртку
# заменили на свободный бинарь — и он сразу нашёл 55 срабатываний, все ложные:
# 53 в истории ВЕНДОРНЫХ ФОРКОВ (их собственные тестовые фикстуры) и 2 на плейсхолдер
# из документации.
#
# Исключения заданы КОММИТАМИ, а не путями. Это самый узкий из возможных вариантов:
# новый коммит в тех же файлах будет просканирован как обычно, а по глобу вида
# `ldr/**` в эти каталоги можно было бы годами носить настоящие ключи.

[extend]
useDefault = true

[allowlist]
description = "Ложные срабатывания: импорт вендорных форков и плейсхолдер в документации"

# Разовые импортные коммиты вендорных форков. `ldr` (local-deep-research) и `memos`
# живут отдельными orphan-ветками этого же репозитория, поэтому их история попадает в
# скан суперпроекта. Найденное — тестовые фикстуры апстрима (`test_log_sanitizer.py`,
# `test_api_key_leakage.py` и подобные), то есть заведомо поддельные ключи в тестах,
# которые ПРОВЕРЯЮТ вырезание секретов из логов.
commits = [
  "25dbac9f5d029ed7049a020d04f520029ed71003", # импорт ldr (43 срабатывания)
  "83a12fc2a04e72c1949e20b633203ead67461cff", # импорт memos (10 срабатываний)
  # `workspace/tests/test_guards.py`: намеренно фиксированная HMAC-fixture для
  # проверки отказа при коротком секрете. Это не ключ окружения и не используется
  # сервисом; исключаем ровно коммит добавления, не весь файл или правило.
  "172890485e049915c5cda2ca8ac4eb2247e238a2",
]

# Плейсхолдер из примера curl в `docs/api.md`: `-H "Authorization: Bearer your-token"`.
# Правило `curl-auth-header` реагирует на форму заголовка, а не на содержимое.
regexes = [
  '''your-token''',
]
