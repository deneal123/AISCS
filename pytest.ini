[pytest]
addopts =
    --cov=service
    --cov-report=term-missing
; 🔴 ПОРОГ ПО ФАКТУ, И ЭТО ХРАПОВИК: ТОЛЬКО ВВЕРХ.
;
; Стоял 85% при фактических 66.5%, то есть не проходил НИ РАЗУ — и поэтому `--no-cov`
; появился в CI, в pre-commit и в каждом ручном запуске. Правило, которое не выполняется
; нигде, не правило: оно врёт о стандартах проекта тому, кто читает конфиг, и заодно даёт
; покрытию падать незаметно.
;
; 67 — по замеру 68.42% на полном наборе, с запасом на разброс между прогонами и на набор
; CI без `cross_service` (он даёт меньше). Прежнее значение 66 снято двумя новыми файлами
; тестов на `messaging/tasks.py` (было 28%) и `chat_worker/engine_env.py` (было 18%) — те
; самые модули, откуда пришли находки сессии.
;
; ХРАПОВИК: поднимать по мере покрытия, НИКОГДА не опускать — опустить его значит снова его
; выключить. Ослабление допустимо лишь вместе с объяснением, ЧТО и ПОЧЕМУ перестало
; покрываться, прямо здесь.
    --cov-fail-under=67
; 🔴 ТОЧНОСТЬ ОБЯЗАТЕЛЬНА, иначе гейт врёт кодом возврата. Сравнение идёт по ОКРУГЛЁННОМУ
; проценту, а сообщение печатается по точному: при 65.76% в отчёте стояло
; «FAIL ... not reached», а процесс завершался УСПЕХОМ (65.76 → 66). Замерено: с этой
; строкой тот же прогон даёт код 1, без неё — 0.
    --cov-precision=2
; --cov=service/agents убран: агентский домен уехал в сабмодуль agents, каталога
; здесь больше нет. Покрытие молча считалось по фантомному источнику при гейте 85%.
filterwarnings =
	ignore:Using extra keyword arguments on `Field` is deprecated.*
	ignore:pkg_resources is deprecated as an API.*
	ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*
markers =
	integration: mark test as integration (slow, requires external services)
