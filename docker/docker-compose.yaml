      AGENTS__PROVIDER_FALLBACK_ORDER: "${AGENTS__PROVIDER_FALLBACK_ORDER:-}"
      # OpenAI-совместимый шлюз /v1 (его зовут memos/ldr/graphify): тот же bearer-ключ,
      # что у backend — чтобы репойнт клиентов на agents:8090/v1 не требовал смены ключа.
      AGENTS__LLM_GATEWAY_ENABLED: "${AGENTS__LLM_GATEWAY_ENABLED:-}"
