      AGENTS__TOOL_DISCLOSURE_TIMEOUT_SEC: "${AGENTS__TOOL_DISCLOSURE_TIMEOUT_SEC:-8}"
      AGENTS__TOOL_DISCLOSURE_CANARY_USER_IDS: "${AGENTS__TOOL_DISCLOSURE_CANARY_USER_IDS:-}"
      AGENTS__WORKFLOW_CATALOG_ENABLED: "${AGENTS__WORKFLOW_CATALOG_ENABLED:-true}"
      AGENTS__WORKFLOW_CATALOG_COLLECTION: "${AGENTS__WORKFLOW_CATALOG_COLLECTION:-gpthub_workflow_catalog}"
      AGENTS__WORKFLOW_CATALOG_TOP_K: "${AGENTS__WORKFLOW_CATALOG_TOP_K:-5}"
      AGENTS__WORKFLOW_CATALOG_MIN_SIMILARITY: "${AGENTS__WORKFLOW_CATALOG_MIN_SIMILARITY:-0.78}"
      AGENTS__WORKFLOW_CATALOG_OUTBOX_LEASE_SEC: "${AGENTS__WORKFLOW_CATALOG_OUTBOX_LEASE_SEC:-120}"
      AGENTS__WORKFLOW_CATALOG_OUTBOX_RETRY_MAX_SEC: "${AGENTS__WORKFLOW_CATALOG_OUTBOX_RETRY_MAX_SEC:-3600}"
      AGENTS__DUCKDB_MAX_BYTES: "${AGENTS__DUCKDB_MAX_BYTES:-}"
      AGENTS__OPENDATALOADER_ENABLED: "${AGENTS__OPENDATALOADER_ENABLED:-}"
      AGENTS__OPENDATALOADER_URL: "${AGENTS__OPENDATALOADER_URL:-}"
      AGENTS__OPENDATALOADER_TIMEOUT_SEC: "${AGENTS__OPENDATALOADER_TIMEOUT_SEC:-}"
      AGENTS__OPENDATALOADER_MAX_BYTES: "${AGENTS__OPENDATALOADER_MAX_BYTES:-}"
      AGENTS__WHISPER_ENABLED: "${AGENTS__WHISPER_ENABLED:-}"
      AGENTS__WHISPER_URL: "${AGENTS__WHISPER_URL:-}"
      AGENTS__WHISPER_DEFAULT_MODEL: "${AGENTS__WHISPER_DEFAULT_MODEL:-}"
      AGENTS__WHISPER_LANGUAGE: "${AGENTS__WHISPER_LANGUAGE:-}"
      AGENTS__WHISPER_TIMEOUT_SEC: "${AGENTS__WHISPER_TIMEOUT_SEC:-}"
      AGENTS__MEMOS_BASE_URL: "${AGENTS__MEMOS_BASE_URL:-}"
      AGENTS__MEMOS_API_KEY: "${AGENTS__MEMOS_API_KEY:-}"
      AGENTS__MEMOS_TIMEOUT_SEC: "${AGENTS__MEMOS_TIMEOUT_SEC:-}"
      AGENTS__MEMOS_MEM_CUBE_ID: "${AGENTS__MEMOS_MEM_CUBE_ID:-}"
      AGENTS__LDR_BASE_URL: "${AGENTS__LDR_BASE_URL:-}"
      AGENTS__LDR_USERNAME: "${AGENTS__LDR_USERNAME:-}"
      AGENTS__LDR_PASSWORD: "${AGENTS__LDR_PASSWORD:-}"
      AGENTS__LDR_MODEL: "${AGENTS__LDR_MODEL:-}"
      AGENTS__LDR_STRATEGY: "${AGENTS__LDR_STRATEGY:-}"
      # ⚠️ Объявлена в .env.example и в settings.py, но в compose ОТСУТСТВОВАЛА —
      # то есть ручка была, а докрутить её в развёртывании было нельзя.
      AGENTS__LDR_SEARCH_ENGINES: "${AGENTS__LDR_SEARCH_ENGINES:-}"
      AGENTS__LDR_ITERATIONS: "${AGENTS__LDR_ITERATIONS:-}"
      AGENTS__LDR_TIMEOUT_SEC: "${AGENTS__LDR_TIMEOUT_SEC:-}"
      AGENTS__LDR_POLL_INTERVAL_SEC: "${AGENTS__LDR_POLL_INTERVAL_SEC:-}"
      # 🔴 Оркестратор «Авто» ЖИВЁТ ЗДЕСЬ, в сайдкаре, — значит и ручка нужна здесь.
      # Без этих двух строк переменные из `.env.*` доезжали только до backend, где
      # служат дефолтом для админки, а сайдкар брал СВОЙ код-дефолт: файл окружения
      # выглядел бы настройкой, ничего не настраивая.
      AGENTS__AUTO_ORCHESTRATOR_ENABLED: "${AGENTS__AUTO_ORCHESTRATOR_ENABLED:-}"
      AGENTS__AUTO_CONFIRM_MODES: "${AGENTS__AUTO_CONFIRM_MODES:-}"
      # Сколько живёт предложение дорогого режима. Отсчёт серверный, молчание = отказ.
      AGENTS__MODE_OFFER_TTL_SEC: "${AGENTS__MODE_OFFER_TTL_SEC:-}"
      # 🔴 ПОЛОВИНА НАСТРОЕК САЙДКАРА ДО НЕГО НЕ ДОЕЗЖАЛА. У backend стоит `env_file`,
      # то есть он получает `.env.*` целиком; у сайдкара — БЕЛЫЙ СПИСОК (иначе
      # `extra="forbid"` уронил бы старт на backend-only ключах вроде ENGINE_MODE).
      # Список отстал от настроек: 68 полей `AgentsConfig` из 136 сюда не попадали, и
      # сайдкар молча брал код-дефолты. Проверено на живом контейнере: `proxy_host=''`
      # при заданном прокси, `llm_provider=auto` при `routerai`, `multi_intent=False`
      # при `true`. То есть файл окружения выглядел настройкой, ничего не настраивая.
      # Полноту списка стережёт `scripts/check_sidecar_env.py`.
      AGENTS__ATTACHMENT_TEXT_MAX_CHARS: "${AGENTS__ATTACHMENT_TEXT_MAX_CHARS:-}"
      AGENTS__CHAT_HISTORY_MESSAGES_LIMIT: "${AGENTS__CHAT_HISTORY_MESSAGES_LIMIT:-}"
      AGENTS__CHAT_MAX_CONTINUATIONS: "${AGENTS__CHAT_MAX_CONTINUATIONS:-}"
      AGENTS__CHAT_MAX_TOKENS: "${AGENTS__CHAT_MAX_TOKENS:-}"
      AGENTS__CHAT_MAX_PROMPT_TOKENS_PER_RUN: "${AGENTS__CHAT_MAX_PROMPT_TOKENS_PER_RUN:-}"
      AGENTS__COMPACTION_THRESHOLD: "${AGENTS__COMPACTION_THRESHOLD:-}"
      AGENTS__CONTEXT_BUDGET_FACTS: "${AGENTS__CONTEXT_BUDGET_FACTS:-}"
      AGENTS__CONTEXT_BUDGET_FILES: "${AGENTS__CONTEXT_BUDGET_FILES:-}"
      AGENTS__CONTEXT_BUDGET_HISTORY: "${AGENTS__CONTEXT_BUDGET_HISTORY:-}"
      AGENTS__CONTEXT_BUDGET_MEMORY: "${AGENTS__CONTEXT_BUDGET_MEMORY:-}"
      AGENTS__CONTEXT_BUDGET_PLAN: "${AGENTS__CONTEXT_BUDGET_PLAN:-}"
      AGENTS__CONTEXT_BUDGET_SUMMARY: "${AGENTS__CONTEXT_BUDGET_SUMMARY:-}"
      AGENTS__CONTEXT_COMPRESSION_ENABLED: "${AGENTS__CONTEXT_COMPRESSION_ENABLED:-}"
      AGENTS__CONTEXT_DEFAULT_WINDOW: "${AGENTS__CONTEXT_DEFAULT_WINDOW:-}"
      AGENTS__CONTEXT_OUTPUT_RESERVE: "${AGENTS__CONTEXT_OUTPUT_RESERVE:-}"
      AGENTS__CONTEXT_PROMPT_OVERHEAD: "${AGENTS__CONTEXT_PROMPT_OVERHEAD:-}"
      AGENTS__CONTEXT_SAFETY_MARGIN: "${AGENTS__CONTEXT_SAFETY_MARGIN:-}"
      AGENTS__CONTEXT_TOKEN_BUDGET: "${AGENTS__CONTEXT_TOKEN_BUDGET:-}"
      AGENTS__DEEP_RESEARCH_PROVIDER: "${AGENTS__DEEP_RESEARCH_PROVIDER:-}"
      AGENTS__GRAPH_INDEX_ENABLED: "${AGENTS__GRAPH_INDEX_ENABLED:-}"
      AGENTS__GRAPH_INDEX_PRICE_RUB_PER_DOC: "${AGENTS__GRAPH_INDEX_PRICE_RUB_PER_DOC:-}"
      AGENTS__HISTORY_SUMMARY_ENABLED: "${AGENTS__HISTORY_SUMMARY_ENABLED:-}"
      AGENTS__LLM_PROVIDER: "${AGENTS__LLM_PROVIDER:-}"
      AGENTS__LLM_RETRY_ATTEMPTS: "${AGENTS__LLM_RETRY_ATTEMPTS:-}"
      AGENTS__LLM_RETRY_BASE_DELAY_SEC: "${AGENTS__LLM_RETRY_BASE_DELAY_SEC:-}"
      AGENTS__LLM_RETRY_MAX_DELAY_SEC: "${AGENTS__LLM_RETRY_MAX_DELAY_SEC:-}"
      AGENTS__MAX_ATTACHMENTS_PER_MESSAGE: "${AGENTS__MAX_ATTACHMENTS_PER_MESSAGE:-}"
      AGENTS__MAX_SUBTASKS: "${AGENTS__MAX_SUBTASKS:-}"
      AGENTS__MAX_TURNS: "${AGENTS__MAX_TURNS:-}"
      AGENTS__MEM0_API_KEY: "${AGENTS__MEM0_API_KEY:-}"
      AGENTS__MEM0_APP_ID: "${AGENTS__MEM0_APP_ID:-}"
      AGENTS__MEMORY_PROVIDER: "${AGENTS__MEMORY_PROVIDER:-}"
      AGENTS__MEMOS_ASYNC_MODE: "${AGENTS__MEMOS_ASYNC_MODE:-}"
      AGENTS__MEMOS_EMBEDDER_DIM: "${AGENTS__MEMOS_EMBEDDER_DIM:-}"
      AGENTS__MEMOS_EMBEDDER_MODEL: "${AGENTS__MEMOS_EMBEDDER_MODEL:-}"
      AGENTS__MULTI_INTENT_ENABLED: "${AGENTS__MULTI_INTENT_ENABLED:-}"
      AGENTS__PROXY_HOST: "${AGENTS__PROXY_HOST:-}"
      AGENTS__PROXY_PASS: "${AGENTS__PROXY_PASS:-}"
      AGENTS__PROXY_PORT: "${AGENTS__PROXY_PORT:-}"
      AGENTS__PROXY_PROVIDERS: "${AGENTS__PROXY_PROVIDERS:-}"
      AGENTS__PROXY_USER: "${AGENTS__PROXY_USER:-}"
      AGENTS__REPO_ALLOWED_HOSTS: "${AGENTS__REPO_ALLOWED_HOSTS:-}"
      AGENTS__REPO_FETCH_TIMEOUT_SEC: "${AGENTS__REPO_FETCH_TIMEOUT_SEC:-}"
      AGENTS__REPO_MAX_BYTES: "${AGENTS__REPO_MAX_BYTES:-}"
      AGENTS__REROUTE_ON_FAILURE_ENABLED: "${AGENTS__REROUTE_ON_FAILURE_ENABLED:-}"
      AGENTS__RUN_TIMEOUT_SEC: "${AGENTS__RUN_TIMEOUT_SEC:-}"
      AGENTS__SIDECAR_TIMEOUT_SEC: "${AGENTS__SIDECAR_TIMEOUT_SEC:-}"
      AGENTS__SIDECAR_URL: "${AGENTS__SIDECAR_URL:-}"
      AGENTS__SUBTASK_SYNTHESIS_MAX_TOKENS: "${AGENTS__SUBTASK_SYNTHESIS_MAX_TOKENS:-}"
      AGENTS__SUMMARY_KEEP_RECENT: "${AGENTS__SUMMARY_KEEP_RECENT:-}"
      AGENTS__SUMMARY_MAX_TOKENS: "${AGENTS__SUMMARY_MAX_TOKENS:-}"
      AGENTS__SUMMARY_TRIGGER_MESSAGES: "${AGENTS__SUMMARY_TRIGGER_MESSAGES:-}"
      AGENTS__UPLOAD_MAX_BYTES: "${AGENTS__UPLOAD_MAX_BYTES:-}"
      AGENTS__WHISPER_PRICE_RUB_PER_MIN: "${AGENTS__WHISPER_PRICE_RUB_PER_MIN:-}"
      AGENTS__CONTEXT_BUDGET_KNOWLEDGE: "${AGENTS__CONTEXT_BUDGET_KNOWLEDGE:-}"
      AGENTS__DOC_EMBEDDER_MAX_TOKENS: "${AGENTS__DOC_EMBEDDER_MAX_TOKENS:-}"
      AGENTS__INSTRUCTIONS_MAX_CHARS: "${AGENTS__INSTRUCTIONS_MAX_CHARS:-}"
      AGENTS__MAX_CONTEXT_CHARS: "${AGENTS__MAX_CONTEXT_CHARS:-}"
      AGENTS__PERSONA_MAX_TOKENS: "${AGENTS__PERSONA_MAX_TOKENS:-}"
      AGENTS__PLAN_STEP_EXECUTION_ENABLED: "${AGENTS__PLAN_STEP_EXECUTION_ENABLED:-}"
      AGENTS__SEARCH_ENGINE_TIMEOUT_SEC: "${AGENTS__SEARCH_ENGINE_TIMEOUT_SEC:-}"
      AGENTS__TOKEN_BUDGET_ENABLED: "${AGENTS__TOKEN_BUDGET_ENABLED:-}"
      AGENTS__MAX_BODY_BYTES: "${AGENTS__MAX_BODY_BYTES:-}"
      # ── Redis для СВОЕГО операционного состояния ────────────────────────────
      # Сайдкар stateless по бизнес-данным (история/память/файлы приезжают в теле
      # запроса), но собственное операционное состояние у него есть — и без Redis
      # оно жило только в памяти процесса:
      #   * кэш сжатия контекста — БЕЗ него каждое сжатие заново гоняет map-reduce
      #     по ЛЛМ, то есть платим за одну и ту же работу повторно;
      #   * circuit breaker и провайдерная политика — теряли durability при рестарте.
      # Передаём ТОЛЬКО то, из чего строится DSN: session/cache-префиксы backend'а
      # сайдкару не нужны и не передаются (least privilege).
      REDIS__ENABLED: "${REDIS__ENABLED:-}"
      REDIS__HOST: "${REDIS__HOST:-}"
      REDIS__PORT: "${REDIS__PORT:-}"
      # ОТДЕЛЬНАЯ база: у backend она 0. Общая означала бы, что сайдкар читает его
      # `provider:blocked:*` — то есть бизнес-состояние админки напрямую, мимо
      # снимка в теле /run. Ровно ту связанность мы и убираем. Здоровье провайдеров
      # кросс-процессным быть больше не должно: сайдкар — единственный, кто звонит.
      REDIS__DB: "${AGENTS__REDIS_DB:-1}"
      REDIS__PASSWORD: "${REDIS__PASSWORD:-}"
    volumes:
      - ../infra/certs/gigachat-ca.pem:/run/certs/gigachat-ca.pem:ro
    networks:
      - internal
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: "always"

  celery-worker-agents:
    profiles: ["prod", "celery"]
    build:
      # Контекст — корень суперпроекта (см. сервис backend выше): Dockerfile
      # копирует по путям вида ./backend/….
      context: ..
      dockerfile: ./backend/docker/Dockerfile
    command: celery -A service.infrastructure.messaging.celery_app worker --loglevel=info --concurrency=4 --queues=agents --hostname=agent-worker@%h
    env_file:
      - ./.env.prod
    environment:
      # 🔴 Ключ сайдкара песочницы — ЯВНО, а не через `env_file`. Секрет объявлен ОДИН раз
      # как `WORKSPACE_API_KEY` (им же закрыт сам сайдкар), а настройки читают его под
      # именем `AGENTS__WORKSPACE_API_KEY`. Завести вторую переменную с тем же значением
      # значило бы держать две копии секрета, которые однажды разъедутся; `env_file`
      # переименовывать не умеет, а `environment` — умеет.
      # Замер на живом стенде: без этой строки воркер получал 401 на КАЖДОМ создании.
      AGENTS__WORKSPACE_API_KEY: "${WORKSPACE_API_KEY:-}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../infra/storage:/var/lib/app/storage
    restart: "always"
    # Celery workers set task_acks_late + task_reject_on_worker_lost so an
    # in-flight task is safely requeued if the worker dies mid-task — but
    # Docker's default 10s stop timeout SIGKILLs well before even a typical
    # chat task (soft_time_limit=300s) can finish its current unit of work on
    # `docker compose down`/redeploy. This doesn't fully eliminate forced
    # kills for very long-running tasks (some queues allow up to ~1h), but it
    # gives SIGTERM's warm shutdown (stop consuming new tasks, finish current
    # ones) a realistic window for the common case instead of none at all.
    stop_grace_period: 90s
    networks:
      - default
      - internal

  # Maintenance workers (low concurrency for background tasks)
  celery-worker-maintenance:
    profiles: ["prod", "celery"]
    build:
      # Контекст — корень суперпроекта (см. сервис backend выше): Dockerfile
      # копирует по путям вида ./backend/….
      context: ..
      dockerfile: ./backend/docker/Dockerfile
    command: celery -A service.infrastructure.messaging.celery_app worker --loglevel=info --concurrency=1 --queues=maintenance --hostname=maintenance-worker@%h
    env_file:
      - ./.env.prod
    environment:
      # 🔴 Ключ сайдкара песочницы — ЯВНО, а не через `env_file`. Секрет объявлен ОДИН раз
      # как `WORKSPACE_API_KEY` (им же закрыт сам сайдкар), а настройки читают его под
      # именем `AGENTS__WORKSPACE_API_KEY`. Завести вторую переменную с тем же значением
      # значило бы держать две копии секрета, которые однажды разъедутся; `env_file`
      # переименовывать не умеет, а `environment` — умеет.
      # Замер на живом стенде: без этой строки воркер получал 401 на КАЖДОМ создании.
      AGENTS__WORKSPACE_API_KEY: "${WORKSPACE_API_KEY:-}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "always"
    stop_grace_period: 90s
    networks:
      - default
      - internal

  # Celery Beat (scheduler for periodic tasks)
  celery-beat:
    profiles: ["prod", "celery"]
    build:
      # Контекст — корень суперпроекта (см. сервис backend выше): Dockerfile
      # копирует по путям вида ./backend/….
      context: ..
      dockerfile: ./backend/docker/Dockerfile
    command: celery -A service.infrastructure.messaging.celery_app beat --loglevel=info
    env_file:
      - ./.env.prod
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "always"
    networks:
      - default
      - internal

  # ═══ MemOS — долговременная память (profile: memos) ═══════════════════════
  # Сабмодуль ../memos + neo4j + qdrant. Хост-порты не публикуем: backend ходит
  # по DNS-имени сервиса (AGENTS__MEMOS_BASE_URL=http://memos:8000). Запуск:
  # MEMOS=1 ./docker/run.sh --prod
  neo4j:
    profiles: ["memos"]
    image: neo4j:5.26.6
    environment:
      # ⚠️ Тот же случай: дефолт-пароль в проде = открытая база графа памяти.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?задайте NEO4J_PASSWORD в .env.prod}
    volumes:
      - neo4j_data:/data
    restart: "always"
    networks:
      - internal

  qdrant:
    profiles: ["prod", "memos"]
    image: qdrant/qdrant:v1.15.3
    volumes:
      - qdrant_data:/qdrant/storage
    restart: "always"
    networks:
      - internal

  memos:
    profiles: ["memos"]
    build:
      context: ../memos
    command: uvicorn memos.api.server_api:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      # LLM/память/эмбеддинги — через единый шлюз САЙДКАРА (http://agents:8090/v1,
      # ключ AGENTS__LLM_GATEWAY_API_KEY). Модель как "<provider>:<model>". compose-
      # переменные (не env_file). MOS_EMBEDDER_PROVIDER=openai — внутр. SDK-селектор MemOS.
      OPENAI_API_KEY: ${AGENTS__LLM_GATEWAY_API_KEY}
      OPENAI_API_BASE: http://agents:8090/v1
      MOS_CHAT_MODEL: ${MEMOS_CHAT_MODEL:-openrouter:openai/gpt-4o-mini}
      MEMRADER_MODEL: ${MEMOS_MEMRADER_MODEL:-openrouter:openai/gpt-4o-mini}
      MEMRADER_API_KEY: ${AGENTS__LLM_GATEWAY_API_KEY}
      MEMRADER_API_BASE: http://agents:8090/v1
      MOS_EMBEDDER_BACKEND: ${MEMOS_EMBEDDER_BACKEND:-universal_api}
      MOS_EMBEDDER_PROVIDER: ${MEMOS_EMBEDDER_PROVIDER:-openai}
      MOS_EMBEDDER_MODEL: ${MEMOS_EMBEDDER_MODEL:-openrouter:openai/text-embedding-3-small}
      MOS_EMBEDDER_API_KEY: ${AGENTS__LLM_GATEWAY_API_KEY}
      MOS_EMBEDDER_API_BASE: http://agents:8090/v1
      EMBEDDING_DIMENSION: ${MEMOS_EMBEDDING_DIMENSION:-1536}
      MOS_RERANKER_BACKEND: ${MEMOS_RERANKER_BACKEND:-cosine_local}
      NEO4J_BACKEND: neo4j-community
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?задайте NEO4J_PASSWORD в .env.prod}
      NEO4J_DB_NAME: neo4j
      MOS_NEO4J_SHARED_DB: "false"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      DEFAULT_USE_REDIS_QUEUE: "false"
      ENABLE_CHAT_API: "true"
    depends_on:
      - neo4j
      - qdrant
    networks:
      - internal
      - default
    restart: "always"

  # ═══ Local Deep Research (profile: ldr) ═══════════════════════════════════
  # Сабмодуль ../ldr + SearXNG. LLM — через наш шлюз в backend.
  # Хост-порты не публикуем. Запуск: LDR=1 ./docker/run.sh --prod
  searxng:
    profiles: ["ldr"]
    # ⚠️ Пин, а не `latest`: это поисковый бэкенд LDR, и смена его версии меняет
    # выдачу исследований. Версия снята с работающего образа.
    image: searxng/searxng:2026.7.7-f69b22c45
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - searxng_data:/etc/searxng
    restart: "always"
    networks:
      - default

  ldr:
    profiles: ["ldr"]
    build:
      context: ../ldr
      dockerfile: docker/Dockerfile
    environment:
      LDR_WEB_HOST: 0.0.0.0
      LDR_WEB_PORT: "5000"
      LDR_DATA_DIR: /data
      LDR_APP_ALLOW_REGISTRATIONS: ${LDR_APP_ALLOW_REGISTRATIONS:-false}
      LDR_LLM_PROVIDER: ${LDR_LLM_PROVIDER:-openai_endpoint}
      LDR_LLM_OPENAI_ENDPOINT_URL: ${LDR_LLM_OPENAI_ENDPOINT_URL:-http://agents:8090/v1}
      LDR_LLM_OPENAI_ENDPOINT_API_KEY: ${AGENTS__LLM_GATEWAY_API_KEY:-}
      LDR_LLM_MODEL: ${LDR_LLM_MODEL:-openrouter:openai/gpt-4o-mini}
      LDR_SEARCH_SEARCH_STRATEGY: ${LDR_SEARCH_STRATEGY:-langgraph-agent}
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL: http://searxng:8080
      # Планировщик подписок LDR. Дефолт у него — ВКЛЮЧЕНО, и гейтит он не только
      # новости: на нём же висят обработка документов библиотеки, реконсиляция
      # неиндексированного и синк Zotero. Ничего из этого мы не используем, а
      # подписка, заведённая через его веб-интерфейс, гоняла бы исследования по
      # расписанию через наш шлюз — то есть за наши деньги и без запроса от юзера.
      LDR_NEWS_SCHEDULER_ENABLED: "${LDR_NEWS_SCHEDULER_ENABLED:-false}"
      LDR_BOOTSTRAP_ALLOW_UNENCRYPTED: ${LDR_BOOTSTRAP_ALLOW_UNENCRYPTED:-false}
    depends_on:
      - searxng
    volumes:
      - ldr_data:/data
    networks:
      - default
    restart: "always"

volumes:
  pg_data_volume:
  minio_data_volume:
  redis_data_volume:
  whisper_models:
  graphify_data:
  neo4j_data:
  qdrant_data:
  ldr_data:
  searxng_data:

networks:
  internal:
    driver: bridge
    internal: true  # Без доступа в интернет для БД
  default:
    driver: bridge
