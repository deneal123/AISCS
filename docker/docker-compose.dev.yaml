# AISCS — единственная dev-конфигурация: весь стек плюс GPU-симулятор.
#
# Здесь всё, что нужно разработчику: фронтенд, API, базы, почта и генератор
# (он же симулятор ЦНС) на видеокарте. Отдельных оверлеев больше нет:
# GPU-настройки генератора живут прямо в этом файле.
#
#   docker compose --env-file docker/.env.dev -p aspa-dev -f docker/docker-compose.dev.yaml up -d
#
# Прод — docker-compose.yaml.

name: aspa-dev

# Почта разработчика: всё, что сервис отправляет, падает в Mailpit.
x-dev-mail: &dev-mail
  MAIL__ENABLED: "true"
  MAIL__HOST: "mailpit"
  MAIL__PORT: "1025"
  MAIL__USE_TLS: "false"
  MAIL__START_TLS: "false"
  MAIL__LOGIN: ""
  MAIL__PASSWORD: ""
  MAIL__FROM_ADDRESS: "no-reply@gpthub.test"

# Ручки IDE по умолчанию выключены: они опасны и включаются осознанно.
x-dev-harness: &dev-harness
  HARNESS__IDE_ENABLED: "${DEV_HARNESS__IDE_ENABLED:-false}"
  HARNESS__IDE_COMMANDS_ENABLED: "${DEV_HARNESS__IDE_COMMANDS_ENABLED:-false}"
  HARNESS__PDF_ENABLED: "${DEV_HARNESS__PDF_ENABLED:-false}"

services:
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:v1.31.5
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8027}:8025"
    networks:
      - internal
      - mailpit-ui
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    profiles: ["dev"]
    build:
      context: ../frontend
      dockerfile: ./docker/Dockerfile
      target: dev
      args:
        REACT_APP_APPLICATION_PROFILE: ${REACT_APP_APPLICATION_PROFILE:-simulation}
    working_dir: /app
    env_file:
      - ./.env.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_APP_API_BASE_URL: ${SERVICE__REACT_APP_API_BASE_URL}
      REACT_APP_WS_BASE_URL: ${SERVICE__REACT_APP_WS_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-8095}:3000"
    depends_on:
      backend:
        condition: service_started
    stdin_open: true
    tty: true

  backend:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile.dev
    env_file:
      - ./.env.dev
    environment:
      <<: [*dev-mail, *dev-harness]
      IDE_CHECKPOINTS__ENABLED: "true"
    volumes:
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
      - ../infra/storage:/var/lib/app/storage
    command: server
    ports:
      - "${BACKEND_PORT:-8094}:8000"
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      mailpit:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - internal

  postgres:
    profiles: ["dev"]
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${PG__USER:-postgres}
      POSTGRES_PASSWORD: ${PG__PASSWORD:-postgres}
      POSTGRES_DB: ${PG__DB:-main}
    env_file:
      - ./.env.dev
    ports:
      - "${POSTGRES_HOST_PORT:-5546}:5432"
    volumes:
      - pg_data_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG__USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      # default is required next to internal: Docker cannot publish ports for a
      # container attached only to an internal network, so ${POSTGRES_HOST_PORT}
      # was bound in HostConfig but never appeared in NetworkSettings.Ports.
      - default
      - internal

  redis:
    profiles: ["dev"]
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS__PASSWORD:-changeme}"]
    volumes:
      - simulation_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS__PASSWORD:-changeme} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    profiles: ["dev"]
    # ⚠️ Образ СВОЙ, из закреплённого исходника: исторические теги MinIO в публичных
    # реестрах недоступны (Docker Hub отвечает pull access denied, Quay — 401),
    # поэтому `pull` вместо сборки валит стек на старте. `pull_policy: build`
    # заставляет compose собрать его из ./minio, а не искать в реестре.
    image: ${MINIO_DEV_IMAGE:-aspa-minio-source:RELEASE.2025-09-07T16-13-09Z}
    build:
      context: ./minio
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      MINIO_ROOT_USER: ${MINIO__ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO__SECRET_KEY:-minioadmin}
    volumes:
      # Named volume, not ../infra/minio_data: every artifact row in Postgres
      # points at an object that already lives in this volume (2.2 GB, 1567
      # objects), while the host directory is empty. A bind mount therefore
      # served an empty bucket and the UI answered "cannot verify this run's
      # connectome and events" for every completed run.
      - minio_data_volume:/data
    ports:
      - "${MINIO_PORT:-9090}:9000"
      - "${MINIO_CONSOLE_PORT:-9091}:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      # Same reason as postgres: ports are published only from a non-internal
      # network, so the console stayed unreachable even though HostConfig had it.
      - default
      - internal

  # Симулятор ЦНС на GPU. Кэш геометрии обязателен: без него batch-путь
  # отвергает gpu-fused конфигурацию (см. _field_geometry_cache).
  generator:
    profiles: ["dev"]
    image: aspa-generator-gpu:dev
    build:
      context: ../generator
      dockerfile: docker/Dockerfile
      target: gpu-runtime
    gpus: all
    env_file:
      - ./.env.dev
    environment:
      SERVICE__APPLICATION_PROFILE: simulation
      GENERATOR_TOKEN: ${GENERATOR_TOKEN:?Задайте GENERATOR_TOKEN в .env.dev}
      GENERATOR_WORK_DIR: /work
      GENERATOR_FIELD_BACKEND: ${GENERATOR_FIELD_BACKEND:-gpu}
      GENERATOR_FIELD_WORKERS: ${GENERATOR_FIELD_WORKERS:-2}
      GENERATOR_MORPHOLOGY_SPATIAL_WORKERS: ${GENERATOR_MORPHOLOGY_SPATIAL_WORKERS:-4}
      GENERATOR_GEOMETRY_CACHE_DIR: /geometry-cache
      GENERATOR_GEOMETRY_CACHE_MANIFEST_SHA256: ${GENERATOR_GEOMETRY_CACHE_MANIFEST_SHA256:-bf6374d275de2c52b908fa1b7847d3f7a97be401adc70e9a6ad0ca658ab0a725}
      GENERATOR_GEOMETRY_SOURCE_INDEX: /morphology-index/verified-bounds-v2.sqlite
      GENERATOR_GEOMETRY_SOURCE_AUDIT: /morphology-index/verified-bounds-v2.audit.json
      GENERATOR_MORPHOLOGY_DIRS: /morphologies/existing:/morphologies/full
      GENERATOR_MORPHOLOGY_BOUNDS_DB: /morphology-index/verified-bounds-v2.sqlite
      GENERATOR_MORPHOLOGY_BOUNDS_AUDIT: /morphology-index/verified-bounds-v2.audit.json
      GENERATOR_MORPHOLOGY_RADIUS_DB: /morphology-index/verified-radii-v1.sqlite
      GENERATOR_MORPHOLOGY_RADIUS_AUDIT: /morphology-index/verified-radii-v1.audit.json
      GENERATOR_MORPHOLOGY_SEGMENT_DB: /morphology-index/verified-segments-v1.sqlite
      GENERATOR_MORPHOLOGY_SEGMENT_AUDIT: /morphology-index/verified-segments-v1.audit.json
      GENERATOR_SEGMENT_SNAPSHOT_DIR: /work/verified-index-snapshots
      GENERATOR_CNS_OVERVIEW_DIR: /morphologies/overview
      GENERATOR_SYNAPSE_DIR: /synapses
      GENERATOR_NEUROPIL_DIR: /neuropil
      GENERATOR_SOURCE_PAIR_STORE: /source-pairs
      GENERATOR_SOURCE_DIAGNOSTICS_CACHE: /source-diagnostics/sources.sqlite
      GENERATOR_FULL_REPLAY_CACHE: /source-diagnostics/replay-cache
    volumes:
      - generator_scratch:/work
      - ${GENERATOR_GEOMETRY_CACHE_HOST_PATH:-../.data/male-cns/geometry-cache-v1-zlib}:/geometry-cache:ro
      - ${GENERATOR_MORPHOLOGY_EXISTING_PATH:-../.data/male-cns/morphology}:/morphologies/existing:ro
      - ${GENERATOR_MORPHOLOGY_FULL_PATH:-../.data/male-cns/full-morphology}:/morphologies/full:ro
      - ${GENERATOR_MORPHOLOGY_INDEX_PATH:-../.data/male-cns/morphology-index}:/morphology-index:ro
      - ${GENERATOR_CNS_OVERVIEW_PATH:-../.data/male-cns/overview-v1}:/morphologies/overview:ro
      - ${GENERATOR_SYNAPSE_PATH:-../.data/male-cns/synapses}:/synapses:ro
      - ${GENERATOR_SOURCE_PAIR_PATH:-../.data/male-cns/source-pairs-v2}:/source-pairs:ro
      - ${GENERATOR_SOURCE_DIAGNOSTICS_PATH:-../.data/male-cns/source-diagnostics}:/source-diagnostics
      - ${GENERATOR_NEUROPIL_PATH:-../.data/male-cns/neuropil-lod-v1}:/neuropil:ro
    networks:
      - internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery-worker-maintenance:
    profiles: ["dev", "celery"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile.dev
    env_file:
      - ./.env.dev
    environment:
      <<: [*dev-mail, *dev-harness]
      IDE_CHECKPOINTS__ENABLED: "true"
      IDE_CHECKPOINTS__MAINTENANCE_LOCAL_STORAGE_SHARED: "true"
    command: celery -A service.infrastructure.messaging.celery_app worker --loglevel=info --concurrency=1 --queues=maintenance --hostname=maintenance-worker@%h
    volumes:
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
      - ../infra/storage:/var/lib/app/storage
    depends_on:
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - internal

  celery-worker-simulation:
    profiles: ["dev", "celery"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile.dev
    env_file:
      - ./.env.dev
    environment:
      <<: [*dev-mail, *dev-harness]
      SERVICE__APPLICATION_PROFILE: simulation
      GENERATOR_URL: http://generator:8090
      GENERATOR_TOKEN: ${GENERATOR_TOKEN:?Задайте GENERATOR_TOKEN в .env.dev}
    command: celery -A service.infrastructure.messaging.celery_app worker --loglevel=info --concurrency=1 --queues=simulation --hostname=simulation-worker@%h
    volumes:
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
      - ../infra/storage:/var/lib/app/storage
    depends_on:
      mailpit:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      generator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - internal

  celery-beat:
    profiles: ["dev", "celery"]
    build:
      context: ..
      dockerfile: ./backend/docker/Dockerfile.dev
    env_file:
      - ./.env.dev
    environment:
      <<: [*dev-mail, *dev-harness]
      SERVICE__APPLICATION_PROFILE: simulation
    command: celery -A service.infrastructure.messaging.celery_app beat --loglevel=info --schedule=/tmp/simulation-celerybeat
    volumes:
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - internal

volumes:
  pg_data_volume:
  minio_data_volume:
  mailpit_data:
  simulation_redis:
  generator_scratch:

networks:
  internal:
    internal: true
  mailpit-ui:
  default:
