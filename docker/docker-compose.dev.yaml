name: gpthub-dev

services:

  frontend:
    profiles: ["dev"]
    build:
      context: ../frontend
      dockerfile: ./docker/Dockerfile
      target: dev
    working_dir: /app
    env_file:
      - ./.env.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      # CHOKIDAR_USEPOLLING одного недостаточно на webpack 5 (react-scripts 5):
      # его файловый вотчер — watchpack, а не chokidar, и на Docker Desktop
      # (Windows/macOS bind mount) не видит изменений без своего опроса —
      # без этой переменной hot-reload в dev-контейнере молча не работает.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_API_BASE_URL=${SERVICE__REACT_APP_API_BASE_URL}
      - REACT_APP_WS_BASE_URL=${SERVICE__REACT_APP_WS_BASE_URL}
    ports:
      - ${FRONTEND_PORT:-3000}:3000
    depends_on:
      - backend
    stdin_open: true
    tty: true

  backend:
    profiles: ["dev"]
    build:
        # Контекст — корень суперпроекта: Dockerfile.dev копирует по путям вида
        # ./backend/….
        context: ..
        dockerfile: ./backend/docker/Dockerfile.dev
    env_file:
      - ./.env.dev
    environment:
      # 🔴 Ключ сайдкара песочницы — ЯВНО, а не через `env_file`. Секрет объявлен ОДИН раз
      # как `WORKSPACE_API_KEY` (им же закрыт сам сайдкар), а настройки читают его под
      # именем `AGENTS__WORKSPACE_API_KEY`. Завести вторую переменную с тем же значением
      # значило бы держать две копии секрета, которые однажды разъедутся; `env_file`
      # переименовывать не умеет, а `environment` — умеет.
      # Замер на живом стенде: без этой строки воркер получал 401 на КАЖДОМ создании.
      AGENTS__WORKSPACE_API_KEY: "${WORKSPACE_API_KEY:-}"
    volumes:
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
      - ../infra/storage:/var/lib/app/storage
    command: server
    ports:
      - ${BACKEND_PORT:-8000}:8000
    stdin_open: true
    tty: true
    restart: "always"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - internal

  postgres:
    profiles: ["dev"]
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${PG__USER}
      POSTGRES_PASSWORD: ${PG__PASSWORD}
      POSTGRES_DB: ${PG__DB}
    env_file:
      - ./.env.dev
    ports:
      - ${PG__PORT:-5432}:5432
    volumes:
      - pg_data_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "always"
    networks:
      - internal

  redis:
    profiles: ["dev"]
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS__PASSWORD:-changeme}"]
    volumes:
      - ../infra/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "always"
    networks:
      - internal

  minio:
    profiles: ["dev"]
    # ⚠️ Пин, а не `latest`: это ХРАНИЛИЩЕ ПОЛЬЗОВАТЕЛЬСКИХ ФАЙЛОВ, и молчаливое
    # обновление образа при следующем `pull` меняло бы его без единой строчки в
    # диффе. Версия — та, что реально работает сейчас (снята с локального образа).
    # Поднимать осознанно: у MinIO бывают релизы со сменой поведения консоли и прав.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO__ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO__SECRET_KEY:-minioadmin}
    volumes:
      - ../infra/minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: "always"

  # Local speech-to-text via whisper.cpp (sidecar). Один контейнер обслуживает
  # несколько ggml-моделей (выбор per-request). На internal-сети (доступен бэку)
  # и default (нужен интернет для разовой загрузки моделей с HuggingFace).
  whisper:
    profiles: ["dev"]
    build:
      context: ../whisper
      dockerfile: docker/Dockerfile
    environment:
      WHISPER_MODELS: "${WHISPER_MODELS:-base small large-v3-turbo-q5_0}"
      WHISPER_DEFAULT_MODEL: "${AGENTS__WHISPER_DEFAULT_MODEL:-base}"
      WHISPER_THREADS: "${WHISPER_THREADS:-4}"
      # Сумма дедлайнов (540) строго меньше клиентского AGENTS__WHISPER_TIMEOUT_SEC=600.
      WHISPER_FFMPEG_TIMEOUT_SEC: "${WHISPER_FFMPEG_TIMEOUT_SEC:-120}"
      WHISPER_TRANSCRIBE_TIMEOUT_SEC: "${WHISPER_TRANSCRIBE_TIMEOUT_SEC:-420}"
    volumes:
      - whisper_models:/models
    networks:
      - default
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: "always"

  # Парсинг документов в markdown для LLM: opendataloader-pdf (Java) + LibreOffice
  # headless для office-форматов. В отличие от whisper — только на internal-сети:
  # в рантайме интернет не нужен (JAR и LibreOffice уже в образе).
  opendataloader:
    profiles: ["dev"]
    build:
      context: ../opendataloader
      dockerfile: docker/Dockerfile
    environment:
      ODL_MAX_BYTES: "${AGENTS__OPENDATALOADER_MAX_BYTES:-20971520}"
      ODL_LO_TIMEOUT_SEC: "${ODL_LO_TIMEOUT_SEC:-70}"
      ODL_PARSE_TIMEOUT_SEC: "${ODL_PARSE_TIMEOUT_SEC:-95}"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: "always"

  # Граф знаний: код (tree-sitter AST, БЕЗ LLM) и документы (семантический проход LLM
  # через наш шлюз). Как и opendataloader — только internal: интернет в рантайме не
  # нужен, а git clone по URL не поддерживаем намеренно (это был бы SSRF).
  graphify:
    profiles: ["dev"]
    build:
      context: ../graphify
      dockerfile: docker/Dockerfile
    environment:
      # Семантический проход по документам идёт через наш мультипровайдерный шлюз —
      # так же, как это уже делают memos и ldr.
      # LLM-шлюз переехал в сайдкар agents (он теперь единственный владелец
      # мультипровайдерного слоя). Ключ тот же, поэтому репойнт механический.
      OPENAI_BASE_URL: "http://agents:8090/v1"
      OPENAI_API_KEY: "${AGENTS__LLM_GATEWAY_API_KEY}"
      GFY_MODEL: "${AGENTS__GRAPHIFY_MODEL:-openrouter:openai/gpt-4o-mini}"
      GFY_MAX_BYTES: "${AGENTS__GRAPHIFY_MAX_BYTES:-52428800}"
      GFY_BUILD_BUDGET_SEC: "${GFY_BUILD_BUDGET_SEC:-840}"
    volumes:
      - graphify_data:/graphs
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: "always"

  # Аналитика по табличным файлам: SQL через DuckDB (csv/tsv/parquet/json/xlsx).
  # Как opendataloader/graphify — только internal: интернет в рантайме не нужен
  # (движок и ридеры встроены; DuckDB-расширения намеренно НЕ тянем по сети).
  duckdb:
    profiles: ["dev"]
    build:
      context: ../duckdb
      dockerfile: docker/Dockerfile
    environment:
      DUCKDB_MAX_ROWS: "${AGENTS__DUCKDB_MAX_ROWS:-200}"
      DUCKDB_HARD_MAX_ROWS: "${AGENTS__DUCKDB_HARD_MAX_ROWS:-2000}"
      DUCKDB_MEMORY_LIMIT: "${AGENTS__DUCKDB_MEMORY_LIMIT:-512MB}"
      DUCKDB_MAX_BODY_BYTES: "${AGENTS__DUCKDB_MAX_BODY_BYTES:-67108864}"
      # СЕРВЕРНЫЙ дедлайн SQL, строго меньше клиентского (AGENTS__DUCKDB_TIMEOUT_SEC=60).
      DUCKDB_QUERY_TIMEOUT_SEC: "${DUCKDB_QUERY_TIMEOUT_SEC:-45}"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: "always"

  # Сайдкар файловой песочницы: агент читает, пишет и выполняет команды в контейнере
  # арендатора.
  #
  # 🔴 ЕДИНСТВЕННЫЙ СЕРВИС С `docker.sock`. Слой agents исполняет управляемый моделью поток
  # для ВСЕХ арендаторов одним процессом — доступ к демону оттуда означал бы root на хосте
  # из кода, который пишет модель. Граница проходит здесь и только здесь.
  #
  # ⚠️ Сокет смонтирован ТОЛЬКО ДЛЯ ЧТЕНИЯ — это ничего не ограничивает (протокол демона
  # весь идёт запросами по сокету), но фиксирует намерение и ловит случайную запись в него.
  # Настоящая граница — ключ сервиса и токен владения, а не флаг монтирования.
  # 🔴 САМАЯ ДОРОГАЯ СПОСОБНОСТЬ ПОСЛЕ РЕСЁРЧА и единственная, кроме песочницы, которой
  # нужен ВЫХОД НАРУЖУ: сервис качает ролик по адресу из сообщения пользователя. Поэтому
  # он стоит в `default` и НЕ стоит в `internal` — тир хранилищ ему недоступен вовсе.
  # Второй слой — в коде: `net_guard` резолвит адрес и отвергает приватный/loopback.
  video:
    profiles: ["dev"]
    build:
      context: ../video
      dockerfile: docker/Dockerfile
    environment:
      VIDEO_API_KEY: "${VIDEO_API_KEY:-}"
      VIDEO_MAX_DURATION_SEC: "${VIDEO_MAX_DURATION_SEC:-7200}"
      VIDEO_MAX_DOWNLOAD_BYTES: "${VIDEO_MAX_DOWNLOAD_BYTES:-2147483648}"
      # СЕРВЕРНЫЙ дедлайн просмотра. Строго МЕНЬШЕ клиентского
      # (AGENTS__VIDEO_TIMEOUT_SEC=480): иначе клиент уходит раньше, чем сервер успевает
      # ответить отказом, и причина теряется.
      VIDEO_WATCH_TIMEOUT_SEC: "${VIDEO_WATCH_TIMEOUT_SEC:-420}"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: "always"

  workspace:
    profiles: ["dev"]
    build:
      context: ../workspace
      dockerfile: docker/Dockerfile
    environment:
      WORKSPACE_API_KEY: "${WORKSPACE_API_KEY:-}"
      WORKSPACE_OWNER_SECRET: "${WORKSPACE_OWNER_SECRET:-}"
      WORKSPACE_DRIVER: "${WORKSPACE_DRIVER:-docker}"
      # Образ РАНТАЙМА песочницы (собирается docker/build.sh отдельным шагом). В голом
      # python-slim нет git, и история версий песочницы молча не велась бы.
      WORKSPACE_IMAGE: "${WORKSPACE_IMAGE:-gpthub-workspace-runtime:latest}"
      WORKSPACE_DOCUMENT_IMAGE: "${WORKSPACE_DOCUMENT_IMAGE:-gpthub-document-runtime:latest}"
      WORKSPACE_DOCUMENT_BUILD_TIMEOUT_SEC: "${WORKSPACE_DOCUMENT_BUILD_TIMEOUT_SEC:-240}"
      WORKSPACE_DOCUMENT_MAX_SOURCE_BYTES: "${WORKSPACE_DOCUMENT_MAX_SOURCE_BYTES:-33554432}"
      WORKSPACE_DOCUMENT_MAX_ARTIFACT_BYTES: "${WORKSPACE_DOCUMENT_MAX_ARTIFACT_BYTES:-67108864}"
      WORKSPACE_DOCUMENT_MEMORY_BYTES: "${WORKSPACE_DOCUMENT_MEMORY_BYTES:-1610612736}"
      WORKSPACE_DOCUMENT_PIDS_LIMIT: "${WORKSPACE_DOCUMENT_PIDS_LIMIT:-384}"
      WORKSPACE_DOCUMENT_CPUS: "${WORKSPACE_DOCUMENT_CPUS:-2}"
      WORKSPACE_GIT_AUTHOR: "${WORKSPACE_GIT_AUTHOR:-GPTHub Agent <agent@gpthub.local>}"
      WORKSPACE_TTL_SEC: "${WORKSPACE_TTL_SEC:-1800}"
      WORKSPACE_HARD_TTL_SEC: "${WORKSPACE_HARD_TTL_SEC:-14400}"
      WORKSPACE_EXEC_TIMEOUT_SEC: "${WORKSPACE_EXEC_TIMEOUT_SEC:-120}"
      WORKSPACE_HARD_EXEC_TIMEOUT_SEC: "${WORKSPACE_HARD_EXEC_TIMEOUT_SEC:-600}"
      WORKSPACE_MAX_OUTPUT_CHARS: "${WORKSPACE_MAX_OUTPUT_CHARS:-20000}"
      WORKSPACE_MAX_WORKSPACES: "${WORKSPACE_MAX_WORKSPACES:-32}"
      WORKSPACE_MAX_BODY_BYTES: "${WORKSPACE_MAX_BODY_BYTES:-4194304}"
      # Mutations stay fail-closed and reach the backend-owned Redis coordinator
      # over the public/default service network. The sidecar never joins internal.
      WORKSPACE_COORDINATION_SECRET: "${WORKSPACE_COORDINATION_SECRET:-}"
      WORKSPACE_COORDINATION_REQUIRED: "true"
      WORKSPACE_COORDINATOR_URL: "${WORKSPACE_COORDINATOR_URL:-http://backend:8000}"
      WORKSPACE_COORDINATOR_TIMEOUT_SEC: "${WORKSPACE_COORDINATOR_TIMEOUT_SEC:-2}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # 🔴 НАРУЖУ — ДА, ВНУТРЬ — НЕТ. Файлы пользователя лежат во ВНЕШНЕМ объектном
      # хранилище, а сайдкар качает их сам (импорт идёт ССЫЛКАМИ, не байтами). Стоя
      # только в `internal` (сеть без интернета), он не мог разрешить даже имя хранилища:
      # импорт падал ВСЕГДА, и рабочий каталог был пуст — при том что файл «приложен».
      # Найдено живым прогоном: «Unable to resolve host: s3.…».
      #
      # Поэтому сервис переведён в `default` (выход в интернет) и УБРАН из `internal`:
      # тир хранилищ — postgres, redis, qdrant, neo4j и прочие сайдкары — ему отныне
      # недоступен вовсе. Вызывающие (backend, celery-worker-agents, agents) стоят в
      # обеих сетях и достают его по `default`.
      #
      # ⚠️ ВТОРОЙ СЛОЙ — В КОДЕ, и он главный: `net_guard` перед скачиванием резолвит
      # адрес и отвергает любой приватный/loopback/link-local. Топология и проверка
      # закрывают одно и то же с разных сторон — сеть можно перенастроить, код нет.
      #
      # ⚠️ САМИ ПЕСОЧНИЦЫ ЭТО НЕ ЗАТРАГИВАЕТ: контейнеры арендаторов создаются с
      # `network: none` (см. `policy.WorkspacePolicy.network`), и код пользователя
      # по-прежнему без сети. Наружу ходит ТОЛЬКО сайдкар и только за импортом.
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: "always"

  # ═══ agents — сайдкар агентного движка (Фаза 2b, вынос из backend) ═════════
  # Пока ОБОЛОЧКА: FastAPI + /health, поднимается вхолостую — backend исполняет движок
  # in-process (AGENTS__ENGINE_MODE=inprocess), поэтому сайдкар НЕ на критическом пути
  # (миграция откатна). Дальше сюда переезжают /run + /route + /v1 + владение
  # провайдерами. Сети internal (к memos/ldr/qdrant) + default (доступность backend'у).
  agents:
    profiles: ["dev", "agents"]
    build:
      # Контекст — САМ сервис: с уходом общего пакета образу больше не нужны файлы
      # соседей, и он перестал зависеть от раскладки суперпроекта.
      context: ../agents
      dockerfile: docker/Dockerfile
    environment:
      PORT: "8090"
      # AUTH__* здесь БОЛЬШЕ НЕТ и быть не должно: сайдкар токены не выпускает и не
      # проверяет. Раньше он подавал фейковый JWT-секрет только чтобы сконструировался
      # чужой Config — то есть сервис вынужден был врать о себе. Теперь секция auth
      # необязательна: нет переменных → она None, и это честно.
      # ── Провайдеры LLM ──────────────────────────────────────────────────────
      # Секреты приходят ИНТЕРПОЛЯЦИЕЙ из .env.dev (в compose только ИМЕНА, значения
      # не коммитятся — как у остальных сайдкаров). Least privilege: отдаём сайдкару
      # ТОЛЬКО провайдерский блок, без БД/JWT/MinIO-кредов backend'а.
      AGENTS__OPENROUTER_API_KEY: "${AGENTS__OPENROUTER_API_KEY:-}"
      AGENTS__OPENROUTER_BASE_URL: "${AGENTS__OPENROUTER_BASE_URL:-}"
      AGENTS__OPENROUTER_TIMEOUT_SEC: "${AGENTS__OPENROUTER_TIMEOUT_SEC:-}"
      AGENTS__OPENROUTER_MODELS_CACHE_TTL_SEC: "${AGENTS__OPENROUTER_MODELS_CACHE_TTL_SEC:-}"
      AGENTS__OPENAI_API_KEY: "${AGENTS__OPENAI_API_KEY:-}"
      AGENTS__OPENAI_BASE_URL: "${AGENTS__OPENAI_BASE_URL:-}"
      AGENTS__ROUTERAI_API_KEY: "${AGENTS__ROUTERAI_API_KEY:-}"
      AGENTS__ROUTERAI_BASE_URL: "${AGENTS__ROUTERAI_BASE_URL:-}"
      AGENTS__ROUTERAI_TIMEOUT_SEC: "${AGENTS__ROUTERAI_TIMEOUT_SEC:-}"
      AGENTS__ROUTERAI_MODELS_CACHE_TTL_SEC: "${AGENTS__ROUTERAI_MODELS_CACHE_TTL_SEC:-}"
      AGENTS__MWS_API_KEY: "${AGENTS__MWS_API_KEY:-}"
      AGENTS__MWS_BASE_URL: "${AGENTS__MWS_BASE_URL:-}"
      AGENTS__MWS_TIMEOUT_SEC: "${AGENTS__MWS_TIMEOUT_SEC:-}"
      AGENTS__MWS_MODELS_CACHE_TTL_SEC: "${AGENTS__MWS_MODELS_CACHE_TTL_SEC:-}"
      AGENTS__GIGACHAT_AUTHORIZATION_KEY: "${AGENTS__GIGACHAT_AUTHORIZATION_KEY:-}"
      AGENTS__GIGACHAT_BASE_URL: "${AGENTS__GIGACHAT_BASE_URL:-https://api.giga.chat/v1}"
      AGENTS__GIGACHAT_OAUTH_URL: "${AGENTS__GIGACHAT_OAUTH_URL:-}"
      AGENTS__GIGACHAT_SCOPE: "${AGENTS__GIGACHAT_SCOPE:-}"
      AGENTS__GIGACHAT_VERIFY_SSL: "${AGENTS__GIGACHAT_VERIFY_SSL:-true}"
      AGENTS__GIGACHAT_CA_BUNDLE: "${AGENTS__GIGACHAT_CA_BUNDLE:-/run/certs/gigachat-ca.pem}"
      AGENTS__GIGACHAT_TIMEOUT_SEC: "${AGENTS__GIGACHAT_TIMEOUT_SEC:-}"
      AGENTS__GIGACHAT_TOKEN_SKEW_SEC: "${AGENTS__GIGACHAT_TOKEN_SKEW_SEC:-}"
      AGENTS__GIGACHAT_MODELS_CACHE_TTL_SEC: "${AGENTS__GIGACHAT_MODELS_CACHE_TTL_SEC:-}"
      AGENTS__PROVIDER_FAILOVER_ENABLED: "${AGENTS__PROVIDER_FAILOVER_ENABLED:-}"
      AGENTS__PROVIDER_FALLBACK_ORDER: "${AGENTS__PROVIDER_FALLBACK_ORDER:-}"
      # OpenAI-совместимый шлюз /v1 (его зовут memos/ldr/graphify): тот же bearer-ключ,
      # что у backend — чтобы репойнт клиентов на agents:8090/v1 не требовал смены ключа.
      AGENTS__LLM_GATEWAY_ENABLED: "${AGENTS__LLM_GATEWAY_ENABLED:-}"
      AGENTS__LLM_GATEWAY_API_KEY: "${AGENTS__LLM_GATEWAY_API_KEY:-}"
      # ── Интеграции инструментов движка ──────────────────────────────────────
      # Инструменты движка ходят к СОСЕДНИМ сайдкарам и Qdrant по internal-сети.
      # Без этих адресов при ENGINE_MODE=http отвалились бы база знаний, аналитика
      # файлов, конвертация документов, ASR и deep research.
      AGENTS__QDRANT_URL: "${AGENTS__QDRANT_URL:-}"
      AGENTS__VECTOR_SEARCH_ENABLED: "${AGENTS__VECTOR_SEARCH_ENABLED:-}"
      AGENTS__DOC_VECTOR_COLLECTION: "${AGENTS__DOC_VECTOR_COLLECTION:-}"
      AGENTS__DOC_VECTOR_TOP_K: "${AGENTS__DOC_VECTOR_TOP_K:-}"
      AGENTS__DOC_EMBEDDER_MODEL: "${AGENTS__DOC_EMBEDDER_MODEL:-}"
      AGENTS__DOC_EMBEDDER_DIM: "${AGENTS__DOC_EMBEDDER_DIM:-}"
      AGENTS__DOC_CHUNK_TOKENS: "${AGENTS__DOC_CHUNK_TOKENS:-}"
      AGENTS__DOC_CHUNK_OVERLAP_TOKENS: "${AGENTS__DOC_CHUNK_OVERLAP_TOKENS:-}"
      AGENTS__GRAPHIFY_ENABLED: "${AGENTS__GRAPHIFY_ENABLED:-}"
      AGENTS__GRAPHIFY_URL: "${AGENTS__GRAPHIFY_URL:-}"
      AGENTS__GRAPHIFY_MODEL: "${AGENTS__GRAPHIFY_MODEL:-}"
      AGENTS__GRAPHIFY_TIMEOUT_SEC: "${AGENTS__GRAPHIFY_TIMEOUT_SEC:-}"
      AGENTS__GRAPHIFY_MAX_BYTES: "${AGENTS__GRAPHIFY_MAX_BYTES:-}"
      AGENTS__DUCKDB_ENABLED: "${AGENTS__DUCKDB_ENABLED:-}"
