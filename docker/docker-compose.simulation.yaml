# Scientific profile extends the copied, tested GPTHub development services.
# The original dev/prod definitions remain in docker-compose*.yaml.
name: aspa-dev

x-scientific-environment: &scientific-environment
  SERVICE__APPLICATION_PROFILE: simulation
  GENERATOR_URL: http://generator:8090
  GENERATOR_TOKEN: ${GENERATOR_TOKEN:?Set generator credential in ignored .env.dev}

services:
  frontend:
    extends: {file: docker-compose.dev.yaml, service: frontend}
    image: aspa-dev-frontend:latest
    environment:
      REACT_APP_APPLICATION_PROFILE: simulation
    ports: !override ["127.0.0.1:${FRONTEND_PORT:-8095}:3000"]
  backend:
    extends: {file: docker-compose.dev.yaml, service: backend}
    image: aspa-dev-backend:latest
    environment: *scientific-environment
    volumes: !override
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
      - simulation_storage:/var/lib/app/storage
    ports: !override ["127.0.0.1:${BACKEND_PORT:-8094}:8000"]
    depends_on:
      generator: {condition: service_healthy}
      minio: {condition: service_healthy}
  postgres:
    extends: {file: docker-compose.dev.yaml, service: postgres}
    ports: !override ["127.0.0.1:${POSTGRES_HOST_PORT:-5546}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  redis:
    extends: {file: docker-compose.dev.yaml, service: redis}
    volumes: !override ["simulation_redis:/data"]
  minio:
    extends: {file: docker-compose.dev.yaml, service: minio}
    # Build the pinned upstream source; historical public image delivery failed.
    # This is a local source build, not the original release's image digest.
    image: ${MINIO_DEV_IMAGE:-aspa-minio-source:RELEASE.2025-09-07T16-13-09Z}
    build: {context: ./minio, dockerfile: Dockerfile}
    pull_policy: build
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: !override ["minio_data_volume:/data"]
    ports: !override
      - "127.0.0.1:${MINIO_PORT:-9090}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9091}:9001"
  mailpit:
    extends: {file: docker-compose.dev.yaml, service: mailpit}
    ports: !override ["127.0.0.1:${MAILPIT_PORT:-8027}:8025"]
  celery-worker-agents:
    extends: {file: docker-compose.dev.yaml, service: celery-worker-agents}
    profiles: !override ["assistant"]
    image: aspa-dev-backend:latest
    environment: *scientific-environment
    depends_on: !override
      backend: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: !override
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
      - simulation_storage:/var/lib/app/storage
  celery-worker-maintenance:
    extends: {file: docker-compose.dev.yaml, service: celery-worker-maintenance}
    image: aspa-dev-backend:latest
    environment: *scientific-environment
    volumes: !override
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
      - simulation_storage:/var/lib/app/storage
  celery-worker-simulation:
    extends: {file: docker-compose.dev.yaml, service: celery-worker-maintenance}
    image: aspa-dev-backend:latest
    environment: *scientific-environment
    command: celery -A service.infrastructure.messaging.celery_app worker --loglevel=info --concurrency=1 --queues=simulation --hostname=simulation-worker@%h
    volumes: !override
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
      - simulation_storage:/var/lib/app/storage
    depends_on:
      generator: {condition: service_healthy}
  celery-beat:
    extends: {file: docker-compose.dev.yaml, service: celery-beat}
    image: aspa-dev-backend:latest
    environment: *scientific-environment
    command: celery -A service.infrastructure.messaging.celery_app beat --loglevel=info --schedule=/tmp/simulation-celerybeat
    volumes: !override
      - ../backend/service:/dude/service
      - ../backend/alembic:/dude/alembic
  generator:
    profiles: ["dev", "generator"]
    image: aspa-generator:dev
    build:
      context: ../generator
      dockerfile: docker/Dockerfile
    environment:
      GENERATOR_TOKEN: ${GENERATOR_TOKEN}
      GENERATOR_WORK_DIR: /work
      GENERATOR_MORPHOLOGY_DIRS: /morphologies/existing:/morphologies/full
      GENERATOR_MORPHOLOGY_BOUNDS_DB: /morphology-index/verified-bounds-v2.sqlite
      GENERATOR_MORPHOLOGY_BOUNDS_AUDIT: /morphology-index/verified-bounds-v2.audit.json
      GENERATOR_MORPHOLOGY_RADIUS_DB: /morphology-index/verified-radii-v1.sqlite
      GENERATOR_MORPHOLOGY_RADIUS_AUDIT: /morphology-index/verified-radii-v1.audit.json
      GENERATOR_MORPHOLOGY_SEGMENT_DB: /morphology-index/verified-segments-v1.sqlite
      GENERATOR_MORPHOLOGY_SEGMENT_AUDIT: /morphology-index/verified-segments-v1.audit.json
      # Verified content-addressed copy avoids rereading the large Windows bind mount.
      GENERATOR_SEGMENT_SNAPSHOT_DIR: /work/verified-index-snapshots
      GENERATOR_MORPHOLOGY_SPATIAL_WORKERS: ${GENERATOR_MORPHOLOGY_SPATIAL_WORKERS:-4}
      GENERATOR_FIELD_WORKERS: ${GENERATOR_FIELD_WORKERS:-2}
      GENERATOR_CNS_OVERVIEW_DIR: /morphologies/overview
      GENERATOR_SYNAPSE_DIR: /synapses
      GENERATOR_NEUROPIL_DIR: /neuropil
    volumes:
      - generator_scratch:/work
      - ${GENERATOR_MORPHOLOGY_EXISTING_PATH:-../.data/male-cns/morphology}:/morphologies/existing:ro
      - ${GENERATOR_MORPHOLOGY_FULL_PATH:-../.data/male-cns/full-morphology}:/morphologies/full:ro
      - ${GENERATOR_MORPHOLOGY_INDEX_PATH:-../.data/male-cns/morphology-index}:/morphology-index:ro
      - ${GENERATOR_CNS_OVERVIEW_PATH:-../.data/male-cns/overview-v1}:/morphologies/overview:ro
      - ${GENERATOR_SYNAPSE_PATH:-../.data/male-cns/synapses}:/synapses:ro
      - ${GENERATOR_NEUROPIL_PATH:-../.data/male-cns/neuropil-lod-v1}:/neuropil:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pg_data_volume:
  minio_data_volume:
  mailpit_data:
  simulation_storage:
  simulation_redis:
  generator_scratch:

networks:
  internal: {driver: bridge, internal: true}
  default: {driver: bridge}
  mailpit-ui: {driver: bridge}
