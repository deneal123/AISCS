[project]
name = "gpthub-agents"
version = "0.1.0"
description = "Сайдкар агентного движка GPTHub: мультипровайдерный LLM-слой, роутинг, инструменты, стриминг"
requires-python = ">=3.13,<3.14"

# Зависимости объявлены ЗДЕСЬ, а не строками `pip install` в Dockerfile. Так они
# одни на образ, CI и локальный запуск — раньше список дублировался в трёх местах и
# синхронизировался вручную, по комментарию «версии синхронны с backend».
#
# Верхние границы у всех: мажорный апгрейд SDK не должен приезжать молча в сборку.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # Основной SDK движка.
    "openai-agents>=0.1.0,<1.0.0",
    # ⚠️ ЯВНО, хотя её тянет openai-agents: `AsyncOpenAI` импортируется напрямую в
    # четырёх клиентах провайдеров. Полагаться на транзитивность у зависимости,
    # без которой сервис не работает вовсе, — это ждать тихой поломки при сдвиге
    # апстрима. У backend ровно так и вышло с `cryptography`.
    "openai>=1.40.0,<3.0.0",
    "httpx>=0.27.0,<0.28.0",
    "python-pptx>=1.0.0,<2.0.0",
    "redis>=5.0.1,<6.0.0",
    # ⚠️ pydantic-settings нужен конфигу НАПРЯМУЮ; раньше приезжал только
    # транзитивно (openai-agents→mcp, uvicorn[standard]), то есть апстрим-сдвиг у
    # соседа ронял бы старт контейнера на импорте настроек.
    #
    # `python-dotenv` отсюда УБРАН: комментарий утверждал, что он нужен конфигу, но
    # `service/settings/` не объявляет `env_file` вовсе — сайдкар получает
    # окружение из `environment:` compose. Ни одного импорта dotenv в сервисе нет.
    # Туда же `cryptography`: скопирована от backend, где действительно шифрует
    # секреты, а здесь не используется ни разу.
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    # 🔴 Чтение QR/штрихкодов ДЕТЕРМИНИРОВАННО. Взят zbar, а не opencv: коррекция
    # Рида — Соломона у обоих, но zbar — это ctypes-обёртка на сотню килобайт против
    # ~60 МБ колеса opencv с numpy в придачу. Системная библиотека `libzbar0` ставится
    # в Dockerfile — БЕЗ НЕЁ pyzbar импортируется и падает, поэтому декодер fail-open.
    "pyzbar>=0.1.9,<0.2.0",
    # Открывает картинку для декодера (gif/webp/png/jpeg — всё, что принимает чат).
    "pillow>=10.0.0,<13.0.0",
]

[project.optional-dependencies]
# В прод-образ НЕ ставятся: pytest там не нужен, а лишний слой — лишняя поверхность.
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.6.0,<1.0.0",
    # Генератор QR для стража декодера. Вектор РИСУЕТСЯ в тесте, а не лежит блобом
    # base64: по блобу не видно, что в нём закодировано, и «декодер прочитал» стало бы
    # проверкой самого себя.
    "qrcode>=7.4,<9.0",
]

[tool.ruff]
# Те же правила, что у backend: один стиль на монорепо, чтобы переход между
# сервисами не требовал переключения привычек.
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
# Сознательно высокий, как у backend: в движке есть длинные функции пайплайна,
# и снижать порог — отдельная задача, а не побочный эффект наведения порядка.
max-complexity = 70

# Длина строки и табы отключены ТОЧЕЧНО — там, где длинные строки это ТЕКСТ ПРОМПТА,
# а не код. Перенос внутри промпта меняет то, что видит модель: это данные, и
# «отформатировать» их значит незаметно изменить поведение агента. То же с табом
# в routing/constants.py — он часть форматирования списка внутри инструкции.
#
# Это НЕ общее «advisory»: у backend ruff не блокирует вовсе из-за накопленного
# стиль-долга, здесь же линтер блокирующий, а исключения перечислены поимённо и
# обоснованы. Новый файл с длинными строками кода упадёт, как и должен.
[tool.ruff.lint.per-file-ignores]
"service/domain/tools/router.py" = ["E501"]
"service/domain/tools/function_tools.py" = ["E501"]
"service/domain/tools/deep_research.py" = ["E501"]
"service/domain/tools/web_search.py" = ["E501"]
"service/domain/routing/constants.py" = ["E101", "W191"]
# ⚠️ Список проверен МУТАЦИЕЙ: каждая запись снималась, и файл прогонялся линтером.
# Четыре записи ничего не подавляли — файлы давно почищены, а подавление осталось и
# делало вид, что там всё ещё длинные строки. Подавление, которое ничего не подавляет,
# хуже отсутствующего: оно скрывает, что правило в этом файле УЖЕ соблюдается.
#
# В тестах длинные строки — фикстуры (HTML-страницы, ожидаемые ответы): переносить
# их значит менять входные данные теста.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
# Без гейта покрытия: у сайдкара оно не измерялось никогда, и вводить порог заодно
# с наведением порядка значило бы смешать две разные задачи.
#
# ⚠️ `-q` здесь НЕ прописан намеренно: вместе с `-q` из командной строки он даёт
# `-qq`, а это глушит итоговую строку «N passed» — прогон выглядит так, будто ничего
# не посчиталось. Уровень многословности оставляем вызывающему.
asyncio_mode = "strict"
markers = [
    "integration: требует внешних сервисов (Redis, соседние сайдкары)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service"]
