# Конфигурация инструментов сайдкара — НЕ пакет.
#
# `[build-system]` здесь намеренно НЕТ: это приложение, а не библиотека. Блок сборки
# приглашал бы кого-нибудь сделать `pip install .`, чего делать не нужно — сервис
# запускается как скрипт в своём образе.
#
# Рантайм-зависимость (`duckdb+openpyxl`) остаётся ЗАКРЕПЛЁННОЙ В Dockerfile через ARG:
# она ставится из индекса в образ, лок ей не нужен. Здесь — только то, чем сервис
# проверяется.
[project]
name = "gpthub-duckdb-sidecar"
version = "0.1.0"
description = "Сайдкар duckdb: SQL-аналитика по табличным файлам"
requires-python = ">=3.12"

[project.optional-dependencies]
# duckdb здесь нужен ПО-НАСТОЯЩЕМУ: главный тест проверяет, что песочница
# (`enable_external_access=false`) действительно закрывает файловую систему, —
# без самого движка это не проверить. Один wheel.
# ⚠️ duckdb и openpyxl ЗАПИНЕНЫ ровно в те версии, что стоят в образе
# (docker/Dockerfile: ARG DUCKDB_VERSION / ARG OPENPYXL_VERSION). Раньше здесь
# стояли голые имена: тесты песочницы проверяли ПОСЛЕДНЮЮ версию с PyPI, а прод
# исполнял SQL от модели на другой. Это обесценивало главный тест сервиса —
# именно смена версии DuckDB и способна незаметно убрать песочницу. При подъёме
# версии в Dockerfile обновлять здесь же.
dev = ["pytest>=8.0.0,<9.0.0", "ruff>=0.6.0,<1.0.0", "duckdb==1.3.2", "openpyxl==3.1.5"]

[tool.ruff]
# Те же правила, что у backend и agents: один стиль на монорепо.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
# `core`/`app` — СВОИ модули сервиса, но лежат не пакетом, а плоско в `service/`,
# и разные версии ruff классифицируют их по-разному: одна кладёт в третью сторону
# рядом с duckdb/pytest, другая выносит в отдельную группу. Отсюда «поправил у себя
# — упало в хуке» и наоборот. Объявляем явно, чтобы вердикт не зависел от версии.
known-first-party = ["app", "core"]

[tool.pytest.ini_options]
# `pythonpath = ["service"]` — чтобы `from core import ...` работал без установки пакета.
pythonpath = ["service"]
testpaths = ["tests"]
