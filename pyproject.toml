# Конфигурация инструментов сайдкара — НЕ пакет.
#
# `[build-system]` здесь намеренно НЕТ: это приложение, а не библиотека. Блок сборки
# приглашал бы кого-нибудь сделать `pip install .`, чего делать не нужно — сервис
# запускается как скрипт в своём образе.
#
# Рантайм-зависимость (`opendataloader-pdf`) остаётся ЗАКРЕПЛЁННОЙ В Dockerfile через ARG:
# она ставится из индекса в образ, лок ей не нужен. Здесь — только то, чем сервис
# проверяется.
[project]
name = "gpthub-opendataloader-sidecar"
version = "0.1.0"
description = "Сайдкар opendataloader: вложения → структурный markdown"
# ⚠️ Пол версии — по РАНТАЙМУ образа, а не по желанию: eclipse-temurin:21-jre-jammy (Ubuntu 22.04) → системный python3 = 3.10.
# Раньше здесь стояло ">=3.12", хотя сервис никогда на 3.12 не запускался.
requires-python = ">=3.10"

[project.optional-dependencies]
# openpyxl нужен для теста разметки таблиц; opendataloader-pdf (и вместе с ним JVM)
# НЕ нужен — ровно ради этого логика и вынесена в core.py.
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
    "openpyxl==3.1.5",  # разбор таблиц по ячейкам — тестируется без JVM
    # Транспорт сайдкара; версии те же, что в docker/Dockerfile (ARG).
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx>=0.27",  # TestClient FastAPI ходит через httpx
]

[tool.ruff]
# Те же правила, что у backend и agents: один стиль на монорепо.
line-length = 100
# ⚠️ ОБЯЗАТЕЛЬНО совпадает с рантаймом: вместе с правилами `UP` (pyupgrade)
# ruff переписывает код под ЭТУ версию. При "py312" он был вправе внести
# синтаксис 3.12 в сервис на 3.10 — линтер зелёный, образ падает.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# `_cell` — приватное имя, но именно оно строит markdown-таблицу для модели.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
# `core`/`app` — СВОИ модули сервиса, но лежат не пакетом, а плоско в `service/`,
# и разные версии ruff классифицируют их по-разному: одна кладёт в третью сторону
# рядом с duckdb/pytest, другая выносит в отдельную группу. Отсюда «поправил у себя
# — упало в хуке» и наоборот. Объявляем явно, чтобы вердикт не зависел от версии.
known-first-party = ["app", "core"]

[tool.pytest.ini_options]
# `pythonpath = ["service"]` — чтобы `from core import ...` работал без установки пакета.
pythonpath = ["service"]
testpaths = ["tests"]
