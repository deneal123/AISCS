[project]
name = "aspa-presentation-sidecar"
version = "1.1.0"
description = "Dissertation presentation sources, evidence references and guarded XeLaTeX builds"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema>=4.23,<5", "mcp==2.2.0"]
keywords = ["dissertation", "evidence", "presentation"]

[project.urls]
Repository = "https://github.com/deneal123/AISCS/tree/presentation"
Documentation = "https://github.com/deneal123/AISCS/blob/presentation/README.md"

[project.scripts]
presentationctl = "service.cli:main"
presentation-mcp = "service.mcp_server:main"
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["service"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
