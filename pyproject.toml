[project]
name = "aspa-research-sidecar"
version = "1.6.1"
description = "Dissertation evidence registry, curation, hybrid knowledge retrieval and read-only HTTP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.116.2",
    "httpx>=0.27,<1",
    "mcp==2.2.0",
    "neo4j>=5.26,<6",
    "pypdf>=5,<7",
    "uvicorn==0.35.0",
]
keywords = ["dissertation", "evidence", "research"]

[project.urls]
Repository = "https://github.com/deneal123/AISCS/tree/research"
Documentation = "https://github.com/deneal123/AISCS/blob/research/README.md"

[project.scripts]
researchctl = "service.interfaces.cli:main"
research-mcp = "service.interfaces.mcp:main"
research-sidecar = "service.interfaces.http:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/rebuild_2026_09_21.py" = ["E501"]
"migrations/upgrade_schema_2_0.py" = ["E501"]
"scripts/history/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
