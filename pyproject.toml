# Конфигурация инструментов сайдкара — НЕ пакет.
#
# `[build-system]` здесь намеренно НЕТ: это приложение, а не библиотека. Блок сборки
# приглашал бы кого-нибудь сделать `pip install .`, чего делать не нужно — сервис
# запускается как скрипт в своём образе.
#
# Рантайм-зависимость (`duckdb+openpyxl`) остаётся ЗАКРЕПЛЁННОЙ В Dockerfile через ARG:
# она ставится из индекса в образ, лок ей не нужен. Здесь — только то, чем сервис
# проверяется.
[project]
name = "gpthub-duckdb-sidecar"
version = "0.1.0"
description = "Сайдкар duckdb: SQL-аналитика по табличным файлам"
requires-python = ">=3.12"

[project.optional-dependencies]
# duckdb здесь нужен ПО-НАСТОЯЩЕМУ: главный тест проверяет, что песочница
# (`enable_external_access=false`) действительно закрывает файловую систему, —
# без самого движка это не проверить. Один wheel.
dev = ["pytest>=8.0.0,<9.0.0", "ruff>=0.6.0,<1.0.0", "duckdb", "openpyxl"]

[tool.ruff]
# Те же правила, что у backend и agents: один стиль на монорепо.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
# `pythonpath = ["service"]` — чтобы `from core import ...` работал без установки пакета.
pythonpath = ["service"]
testpaths = ["tests"]
