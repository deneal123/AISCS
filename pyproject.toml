[project]
name = "aspa-text-sidecar"
version = "1.1.1"
description = "Source-based dissertation writing, evidence traceability and guarded XeLaTeX builds"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema>=4.23,<5", "mcp==2.2.0"]
keywords = ["dissertation", "evidence", "text"]

[project.urls]
Repository = "https://github.com/deneal123/AISCS/tree/text"
Documentation = "https://github.com/deneal123/AISCS/blob/text/README.md"

[project.scripts]
textctl = "service.cli:main"
text-mcp = "service.mcp_server:main"
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["service"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
