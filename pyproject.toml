[project]
name = "aspa-publications-sidecar"
version = "1.2.1"
description = "Manuscript and poster sources, immutable submissions and guarded publication workflows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema>=4.23,<5", "mcp==2.2.0"]
keywords = ["dissertation", "evidence", "publications"]

[project.urls]
Repository = "https://github.com/deneal123/AISCS/tree/publications"
Documentation = "https://github.com/deneal123/AISCS/blob/publications/README.md"

[project.scripts]
pubctl = "service.cli:main"
publications-mcp = "service.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
