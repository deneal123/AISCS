# Хуки суперпроекта.
#
# ⚠️ ГЛАВНОЕ ПРО ЭТОТ ФАЙЛ: сабмодули для суперпроекта — ГИТЛИНКИ. `git ls-files | grep -cE '^(backend|generator)/'`
# даёт 0 при записях `160000`, поэтому любой хук, отбирающий работу через `files:`/`types:`,
# внутри сервиса не совпадает НИ С ЧЕМ и молча пропускается. Всё, что относится к коду
# сервиса, оформляется как `local`-хук с `pass_filenames: false`, который сам заходит в каталог.
#
# ⚠️ ВТОРОЕ, И ЭТО СТОИЛО ПОЛОВИНЫ ПРОВЕРОК: на этой машине нет POSIX-шелла и нет `python3`.
# `C:/Windows/System32/bash.exe` — релей в WSL-дистрибутив docker-desktop, где нет `/bin/bash`
# (`execvpe(/bin/bash) failed: No such file or directory`), а `python3` — заглушка Microsoft Store,
# которая печатает одно слово и выходит с 9009. Поэтому в записях хуков НЕТ ни `bash -lc`,
# ни `&&`, ни `python3`: одна команда — один хук, а интерпретатор берётся из окружения хука
# (`language: python`) или из `uv`, который есть в PATH. Проверено запуском:
# `pre-commit run --all-files`.
repos:
  # Эти хуки работают по файлам САМОГО суперпроекта (docker/, scripts/, docs/, infra/),
  # там `files:` осмыслен, потому что файлы действительно в индексе.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      # Сгенерированные артефакты (SVG прогонов) и материалы статей цитируются как есть:
      # у них законный хвостовой пробел и перевод строки в конце, а правка меняет байты
      # опубликованных рисунков. Без этого исключения оба фиксера переписывали 38 SVG
      # при КАЖДОМ прогоне, и хук не мог стать зелёным ни разу.
      - id: end-of-file-fixer
        exclude: ^(docs/|simulations/artifacts/)
      - id: trailing-whitespace
        exclude: ^(docs/|simulations/artifacts/)
      - id: check-added-large-files
        # `.*/tests/.*` из списка исключений УБРАН: тестовые фикстуры — ровно то
        # место, куда случайно уезжают многомегабайтные дампы.
        exclude: >
          (?x)^(
              \.git/.*|
              \.venv/.*|
              build/.*|
              dist/.*|
              docs/.*|
              .*/migrations/.*|
              .*/migration/.*|
              .*/alembic/.*|
              .*/package-lock\.json|
              .*/package\.json|
              .*/yarn\.lock|
              .*/public/.*|
              .*/node_modules/.*|
          )$
      - id: check-json
      - id: debug-statements

  # Сканер секретов. Ставится ПОСЛЕДНИМ рубежом: секрет, попавший в коммит, из
  # истории уже не убрать простым откатом — только переписыванием.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # 🔴 Контракт окружения. Пока он был размазан по двум скриптам (check_sidecar_env
      # и check_settings_manifest), он требовал каталоги сайдкаров — и после их удаления
      # падал по построению, то есть не проверял ничего. Здесь одна проверка: ключи
      # шаблона есть в обеих конфигурациях, а переменные, которые читает код, объявлены.
      # Заодно ловится расхождение имён вида GENERATOR_RADIUS_DB против
      # GENERATOR_MORPHOLOGY_RADIUS_DB, которое не видно ни компилятору, ни compose.
      #
      # `language: python` без `additional_dependencies`: pre-commit поднимает пустое
      # окружение ровно для того, чтобы `python` в записи хука означал ИМЕННО его,
      # а не заглушку Microsoft Store, которая стоит первой в PATH.
      # ⚠️ `always_run` ОБЯЗАТЕЛЕН, и `pass_filenames: false` его не заменяет: коммит-бамп
      # состоит из одних гитлинков, то есть файлов в нём НОЛЬ, и pre-commit пропускает
      # хук целиком («no files to check»). А бамп и есть тот момент, когда указатели
      # сабмодулей едут вместе.
      - id: env-contract
        name: контракт окружения (шаблон ↔ конфигурации ↔ код)
        entry: python scripts/check_env_contract.py
        language: python
        pass_filenames: false
        always_run: true

      # 🔴 Backend разбирал `.py`, `.ts`, `.go` и ещё два десятка кодовых расширений, а
      # выбрать такой файл во фронте было НЕЧЕМ: в `accept` их не было вовсе.
      - id: attachment-types
        name: выбираемые вложения ⊇ разбираемые backend
        entry: python scripts/check_attachment_types.py
        language: python
        pass_filenames: false
        always_run: true

      # 🔴 Канонические владельцы контролов. Фронтенд брал `Select` прямо из Chakra в
      # двух панелях симулятора, и этого не видел никто: оба места работали, просто мимо
      # DESIGN.md. Гейт читает frontend/src целиком, поэтому ему файлы не нужны.
      - id: frontend-ui-contract
        name: frontend · канонические владельцы контролов
        entry: python scripts/check_frontend_ui_contract.py
        language: python
        pass_filenames: false
        always_run: true

      # --- Линтеры сервиса ----------------------------------------------------
      # У каждого сервиса СВОЙ pyproject.toml, поэтому каталог задаётся через
      # `uv run --directory`: ruff берёт конфиг оттуда вместе с per-file-ignores.
      # ⚠️ ТОЛЬКО `uv run --frozen`, а не голые `ruff`/`mypy`/`pytest`: `cd` в каталог
      # сервиса НЕ переключает окружение, и голое имя резолвится в венв первого
      # попавшегося соседа (на рабочей машине `pytest` оказывался из duckdb/.venv,
      # и хук падал на «unrecognized arguments: --cov»). `--frozen` — чтобы хук
      # не трогал uv.lock молча.
      #
      # Формат-проверка НЕ включена: `ruff format --check .` красный на 56 файлах
      # из 1364, то есть это массовое переформатирование чужого кода, отдельная работа.
      - id: backend-ruff
        name: backend · ruff (lint)
        entry: uv run --directory backend --frozen ruff check .
        language: system
        pass_filenames: false

      # --- Прочие проверки backend --------------------------------------------
      - id: backend-complexity-guard
        name: backend · complexity guard
        entry: uv run --directory backend --frozen python scripts/check_module_complexity.py
        language: system
        pass_filenames: false

      - id: backend-mypy
        name: backend · mypy
        entry: uv run --directory backend --frozen mypy
        language: system
        pass_filenames: false

      # ⚠️ `--no-cov` обязателен: в `pytest.ini` стоит гейт покрытия, а здесь гоняются
      # ТРИ файла из 114. Покрытие такого среза — 36 %, то есть хук не мог пройти ни при
      # каком состоянии кода.
      - id: backend-pytest-critical
        name: backend · pytest (критические пакеты)
        entry: uv run --directory backend --frozen pytest --no-cov tests/test_chat_service_facade.py tests/test_process_chat_message_core.py tests/test_chat_agent_integration.py
        language: system
        pass_filenames: false

      # Генератор: там lockfile собран под linux (`environments = ["sys_platform == 'linux'"]`),
      # поэтому `uv run --directory generator --frozen` на Windows неисполним вообще.
      # Линт идёт через `uvx ruff` с версией, зафиксированной в записи хука, и только по
      # F/E9: остальные правила требуют массового переформатирования чужого кода.
      # Тесты генератора гоняются в GPU-образе (в образе нет pytest, но есть uv):
      #   docker run --rm -v R:/Aspa/generator:/src -w /src aspa-generator-gpu:20261115 \
      #     sh -lc "cd /src && uv run --frozen --group dev python -m pytest -q tests"
      # Полный прогон 23.11.2026: 1607 passed, 45 skipped за 254,82 с.
      - id: generator-lint
        name: generator · ruff (F, E9)
        entry: uvx ruff@0.15.12 check --select F,E9 generator
        language: system
        pass_filenames: false

      # 🔴 ГЕЙТЫ СУПЕРПРОЕКТА. Они были разбросаны по CI, которого на репозитории нет,
      # поэтому не запускались нигде. Здесь они выполняются на каждом коммите: контракт
      # развёртывания (два compose-файла, GPU-генератор, отсутствие вырезанных сайдкаров)
      # и синхронизация env-файлов.
      #
      # ⚠️ `--no-cov` ЗДЕСЬ НЕЛЬЗЯ: окружение поднимается `--with pytest` без pytest-cov,
      # и неизвестный аргумент валит хук до запуска тестов. Гейта покрытия в scripts/tests
      # нет вовсе, поэтому флаг и не нужен.
      - id: platform-tests
        name: суперпроект · контракты развёртывания и env
        entry: uv run --no-project --with pytest==8.3.3 --with PyYAML==6.0.3 python -m pytest -q -p no:cacheprovider scripts/tests/test_deployment_contract.py scripts/tests/test_env_file_drift.py scripts/tests/test_mermaid_diagrams.py
        language: system
        pass_filenames: false
        always_run: true

      # --- Frontend -----------------------------------------------------------
      # Вызов идёт через `scripts/run_frontend_checks.py`, потому что фронтенд-инструменты
      # требуют рабочего каталога `frontend/`, а `cd` без шелла недоступен. Скрипт сам
      # находит каталог, отказывается угадывать при отсутствующих зависимостях и
      # возвращает код инструмента, а не свой.
      #
      # ⚠️ Пропуск при неустановленных зависимостях — осознанно, и это НЕ смягчение
      # проверки: без `node_modules` хук падает не на коде, а на отсутствии eslint, и
      # тогда ЛЮБОЙ коммит в backend блокируется по причине, к нему не относящейся.
      # Пропуск громкий: в выводе видно, почему.
      - id: frontend-eslint
        name: frontend · ESLint
        entry: python scripts/run_frontend_checks.py eslint
        language: python
        pass_filenames: false

      - id: frontend-snapshots
        name: frontend · тесты
        entry: python scripts/run_frontend_checks.py jest --watchAll=false --updateSnapshot=false
        language: python
        pass_filenames: false
