repos:
  - repo: local
    hooks:
      - id: local-llm-lint
        name: Локальная модель · Ruff
        entry: uv run --frozen --extra dev ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: local-llm-format
        name: Локальная модель · форматирование
        entry: uv run --frozen --extra dev ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: local-llm-tests
        name: Локальная модель · регрессии
        entry: uv run --frozen --extra dev pytest -q
        language: system
        pass_filenames: false
        always_run: true
