# Хуки фронтенда. Ставятся `pre-commit install` ВНУТРИ этого сабмодуля: корневой
# конфиг суперпроекта до него не достаёт — для суперпроекта сабмодуль это гитлинк,
# и правки внутри него корневым хуком не просматриваются.
#
# Здесь только сканер секретов. Линт и снапшоты фронтенда гоняются хуком
# суперпроекта и джобой CI: дублировать их значило бы гонять npm дважды на коммит.
repos:
  # Секреты во фронтенде — не теоретический риск, а самый частый: ключи попадают в
  # бандл через `REACT_APP_*`, и после сборки лежат в статике, отдаваемой всем.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
