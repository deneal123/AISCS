# Хуки САМОГО сайдкара.
#
# Сабмодуль — самостоятельный git-репозиторий: хуки суперпроекта на коммит внутри
# него не срабатывают. Без этого файла правки сайдкара шли бы без единой проверки.
#
# Установка: `pre-commit install` здесь или `make hooks` из корня.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements

  # Сканер секретов. Ставится ПОСЛЕДНИМ рубежом: секрет, попавший в коммит, из
  # истории уже не убрать простым откатом — только переписыванием, поэтому ловить
  # его надо до записи, а не в ревью.
  #
  # Стартует зелёным: прогон по истории backend и agents дал НОЛЬ находок (70
  # «утечек» из первого прогона все оказались внутри .venv, то есть вне гита).
  # Значит разбирать накопленное не пришлось и подавлений заводить не нужно.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + format)
        entry: bash -lc "ruff check . && ruff format --check ."
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: bash -lc "pytest -q"
        language: system
        pass_filenames: false
